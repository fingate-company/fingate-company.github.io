name: Deploy to GitHub Pages

# main 에 push 되면 자동 빌드 후 gh-pages(라이브 브랜치)로 게시.
# 수동 실행도 가능(Actions 탭 → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# peaceiris 가 gh-pages 브랜치에 push 하려면 쓰기 권한 필요
permissions:
  contents: write

# 동시 배포 충돌 방지
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run generate = SEO(sitemap/robots) 생성 + nuxt generate
      # 정적 산출물은 dist/public 에 생성됨
      - name: Generate static site
        run: npm run generate
        env:
          # ── 회사 EmailJS 키 (GitHub → Settings → Secrets and variables → Actions 에 등록) ──
          # 시크릿 미등록 시 config/site.ts 의 fallback 값이 사용됨
          NUXT_PUBLIC_EMAILJS_SERVICE_ID:  ${{ secrets.NUXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NUXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.NUXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NUXT_PUBLIC_EMAILJS_PUBLIC_KEY:  ${{ secrets.NUXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NUXT_PUBLIC_EMAILJS_TO_EMAIL:    ${{ secrets.NUXT_PUBLIC_EMAILJS_TO_EMAIL }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist/public
          # CNAME, .nojekyll 는 public/ → dist/public/ 에 포함되어 그대로 게시됨
          # (커스텀 도메인 fingate.kr 유지)
